[project]
name = "guarded-text2sparql"
version = "0.0.1"
description = "Text-to-SPARQL over eccenca's CK25 knowledge graph: an LLM proposes, deterministic guardrails decide."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "rdflib>=7.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
# Official scorer. Needs a C compiler (pytrec-eval builds from source on macOS).
eval = ["text2sparql-client==2.1.0", "pyyaml>=6"]

[tool.uv]
default-groups = ["dev"]
# No editable install: src is put on the path instead. Concurrent `uv run` builds were
# corrupting the .pth file, and a prototype does not need to be installable.
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
extend-exclude = ["data"]
