services:
  fuseki:
    image: stain/jena-fuseki:5.1.0
    environment:
      ADMIN_PASSWORD: admin   # local dev store, no secrets in it
      FUSEKI_DATASET_1: ck
    ports: ["3030:3030"]
    # ponytail: in-memory dataset, so re-run `make load` after a restart.
    # Loading takes seconds; switch to TDB2 only if that ever gets annoying.
